name: Build Professional Release APK

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write # Required to create GitHub Releases

jobs:
  build:
    name: Build, Test, Lint & Sign
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Environment (with Gradle caching for speed)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # 3. Security: Decode Keystore
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      # 4. Security: Safely Inject Secrets into Gradle Properties
      - name: Inject Secrets into Gradle Properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Appends signing config to gradle.properties temporarily
          echo "RELEASE_STORE_FILE=release.keystore" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> gradle.properties

      # 5. Quality Gates (Fail fast if code is broken)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Lint Checks
        run: ./gradlew lintRelease --no-daemon

      # 6. Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      # 7. Security: Cleanup Sensitive Files (Runs even if build fails)
      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f app/release.keystore
          sed -i '/RELEASE_STORE_FILE/d' gradle.properties
          sed -i '/RELEASE_STORE_PASSWORD/d' gradle.properties
          sed -i '/RELEASE_KEY_ALIAS/d' gradle.properties
          sed -i '/RELEASE_KEY_PASSWORD/d' gradle.properties
          echo "Keystore and credentials cleaned up."

      # 8. Upload Artifacts (APK + Mapping File for crash logs)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ProGuard Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: mapping-txt
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90 # Keep mapping files longer for crash debugging

      # 9. Automated GitHub Release (Only runs on Tag push)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
          draft: false
          prerelease: false